# Lab 7: four empty Debian servers -> Notes API behind nginx.
# Run from this folder: ansible-playbook site.yml

- name: Base for every server
  hosts: all
  become: true
  tasks:
    - name: Base packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - acl
        state: present
        update_cache: true
        cache_valid_time: 3600

- name: Database
  hosts: db
  become: true
  vars:
    db_name: notes
    db_user: notes
    db_password: notes-lab7
  tasks:
    - name: PostgreSQL and the driver Ansible uses to talk to it
      ansible.builtin.apt:
        name:
          - postgresql
          - python3-psycopg2
        state: present

    # the server image has /usr/sbin/policy-rc.d, so apt installs postgresql without starting it
    - name: PostgreSQL is running
      ansible.builtin.service:
        name: postgresql@17-main
        state: started

    - name: Listen on all addresses, not only localhost
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/postgresql.conf
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Allow password logins from the other servers
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/pg_hba.conf
        line: "host all all 0.0.0.0/0 scram-sha-256"
      notify: Restart PostgreSQL

    - name: Database user
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
      become_user: postgres

    - name: Database owned by that user
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
      become_user: postgres

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

- name: Web servers
  hosts: web
  become: true
  vars:
    database_url: postgresql://notes:notes-lab7@db:5432/notes
  tasks:
    - name: Packages the app and the pip module need
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-packaging
          - git
        state: present

    - name: The code from our repository
      ansible.builtin.git:
        repo: https://github.com/borkatah/devops-labs-fn371223025.git
        dest: /opt/notes
        version: main
      notify: Restart notes

    - name: Python dependencies in a virtualenv
      ansible.builtin.pip:
        requirements: /opt/notes/requirements.txt
        virtualenv: /opt/notes/.venv
        virtualenv_command: python3 -m venv

    - name: systemd service
      ansible.builtin.template:
        src: templates/notes.service.j2
        dest: /etc/systemd/system/notes.service
        mode: "0644"
      notify: Restart notes

    - name: notes is running and starts on boot
      ansible.builtin.systemd:
        name: notes
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart notes
      ansible.builtin.systemd:
        name: notes
        state: restarted
        daemon_reload: true
